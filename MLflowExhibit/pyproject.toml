[project]
name = "mlflowexhibit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Behzad", email = "b.moradi@student.unimelb.edu.au" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "matplotlib>=3.11.2",
    "mlflow[genai,langchain]>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
]

[project.scripts]
mlflowexhibit = "mlflowexhibit:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
